# Local OpenTelemetry Collector — optional Compose side-car.
# Crawl.Api / Crawl.Worker export OTLP here when OTEL_EXPORTER_OTLP_ENDPOINT is set.
# Cloud: swap for ADOT sidecar / CloudWatch / X-Ray exporter (still no terraform apply).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

exporters:
  debug:
    verbosity: basic
  # Uncomment for local Jaeger/Tempo later:
  # otlp/jaeger:
  #   endpoint: jaeger:4317
  #   tls:
  #     insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
