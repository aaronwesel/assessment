# Local stack parity with AWS shape: API + Postgres + Redis + frontend.
# Stubs are intentional until backend/frontend Dockerfiles land.
# No secrets here — use .env (from .env.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stub until backend/Dockerfile exists. Replace build/image when API lands.
  # http-echo is scratch-based (no shell); health is port reachability / HTTP GET.
  api:
    image: hashicorp/http-echo:1.0
    command: ["-text=api-stub-ok", "-listen=:8000"]
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:changeme-local-only@db:5432/app}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ENVIRONMENT: ${ENVIRONMENT:-local}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Stub until frontend/Dockerfile exists. Replace build/image when UI lands.
  frontend:
    image: hashicorp/http-echo:1.0
    command: ["-text=frontend-stub-ok", "-listen=:3000"]
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - api

volumes:
  postgres_data:
